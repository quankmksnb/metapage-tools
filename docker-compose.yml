services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: metapage_tools
    ports:
      - "55432:5432"
    volumes:
      - metapage_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metapage_tools"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  metapage_pgdata:
