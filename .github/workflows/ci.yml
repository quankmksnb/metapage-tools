name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          APP_URL: http://localhost:3000
          META_APP_ID: ci-test-app
          META_APP_SECRET: ci-test-secret
          META_VERIFY_TOKEN: ci-verify-token
          GRAPH_VERSION: v25.0
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metapage_tools
          TOKEN_ENC_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          SESSION_SECRET: ci-session-secret-at-least-32-characters
