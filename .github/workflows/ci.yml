name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metapage_tools
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metapage_tools"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run db:migrate -w @metapage/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metapage_tools
      - run: npm test
        env:
          APP_URL: http://localhost:3000
          META_APP_ID: ci-test-app
          META_APP_SECRET: ci-test-secret
          META_VERIFY_TOKEN: ci-verify-token
          GRAPH_VERSION: v25.0
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metapage_tools
          TOKEN_ENC_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc=
          SESSION_SECRET: ci-session-secret-at-least-32-characters
